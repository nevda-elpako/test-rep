name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pushes the built dist/ output straight to a gh-pages branch rather than
# using the Actions Artifacts API (upload-pages-artifact + deploy-pages) —
# this enterprise instance's Actions artifact storage quota is exhausted,
# and this path doesn't depend on it. Pages is configured to serve from
# the gh-pages branch (legacy/branch build_type), same as how the original
# static-site repo's Pages is already set up.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # GitHub-hosted runners are disabled on this Enterprise instance —
    # targets the self-hosted runner registered for this repo instead.
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-deploy
          git rm -rf . > /dev/null 2>&1 || true
          cp -r dist/. .
          touch .nojekyll
          git add -A
          git commit -m "Deploy ${{ github.sha }}"
          git push origin HEAD:gh-pages --force
